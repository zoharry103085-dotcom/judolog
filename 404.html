<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>페이지를 찾을 수 없어요 · JUDOLOG</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#151311;--line:#39332b;--line-strong:#5a5046;--text:#f2ede4;--text-sub:#c8c0b5;--muted:#9a948a;--red:#8b1e22;--red-hover:#a3383b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;word-break:keep-all}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(circle at 50% -20%,var(--line) 0,transparent 38%),var(--bg)}
main{width:100%;max-width:400px;text-align:center;animation:rise .2s cubic-bezier(.2,0,0,1)}
small{display:block;font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--muted)}
h1{margin:12px 0 12px;font-size:24px;line-height:1.3;font-weight:800}
p{margin:0 0 32px;font-size:14px;line-height:1.7;color:var(--text-sub);text-wrap:balance}
a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;width:100%;max-width:240px;padding:0 16px;border:1px solid var(--red-hover);border-radius:4px;background:var(--red);color:var(--text);font-size:14px;font-weight:800;text-decoration:none;transition:background-color .15s ease}
a:active{background:#76181c}
a:focus-visible{outline:2px solid var(--text-sub);outline-offset:2px}
@media(hover:hover){a:hover{background:var(--red-hover)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){main{animation:none}}
</style>
</head>
<body>
<main>
<small>404 · JUDOLOG</small>
<h1>페이지를 찾을 수 없어요</h1>
<p>주소가 바뀌었거나 잘못 입력된 것 같아요.<br>저장한 수련 기록은 그대로 남아 있습니다.</p>
<a href="/">JUDOLOG 홈으로 가기</a>
</main>
</body>
</html>
